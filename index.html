<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Belajar Bilangan Cacah 1–20</title>
<style>
:root{--bg:#fff8e1;--card:#fff;--tx:#1d2b22;--g:#1f6b3a;--y:#f6c026;--r:#e84a4a;--mut:#5d6f64;--ok:#d7f3df;--bad:#fde0e0;--ln:#e6dcc0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12261b;--card:#1b3527;--tx:#eef7f0;--g:#7fdc9d;--mut:#aac4b3;--ok:#1f5a36;--bad:#6a2a2a;--ln:#2f5340}}
:root[data-theme="dark"]{--bg:#12261b;--card:#1b3527;--tx:#eef7f0;--g:#7fdc9d;--mut:#aac4b3;--ok:#1f5a36;--bad:#6a2a2a;--ln:#2f5340}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.55 "Baloo 2","Trebuchet MS","Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--g);color:#fff}
header img{width:54px;height:54px;border-radius:50%;background:#fff}
header h1{font-size:1.1rem;margin:0;flex:1;line-height:1.2}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:2px solid var(--ln);border-radius:18px;padding:16px;margin:0 0 14px}
h2,h3{margin:.2em 0 .4em;line-height:1.25}h2{font-size:1.45rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tp{display:flex;gap:12px;align-items:center;text-align:left;width:100%;cursor:pointer;color:var(--tx);font:inherit;background:var(--card);border:2px solid var(--ln);border-radius:16px;padding:12px}
.tp:hover{border-color:var(--g)}.tp b{display:block}
.ic{font-size:2rem;width:52px;height:52px;border-radius:14px;background:var(--y);display:grid;place-items:center;flex:none}
.bar{height:12px;border-radius:8px;background:var(--ln);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--g);transition:width .4s}
small{color:var(--mut)}
button{font:inherit}
.btn{background:var(--g);color:#fff;border:0;border-radius:24px;padding:10px 20px;cursor:pointer;font-weight:700;margin:4px 6px 4px 0}
.btn.alt{background:var(--y);color:#222}
.ghost{background:none;border:2px solid var(--g);color:var(--g)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:14px;border:2px solid var(--ln);background:var(--card);color:var(--tx);cursor:pointer;font-size:1.1rem}
.opt:hover:not(:disabled){border-color:var(--g)}.opt.ok{background:var(--ok);border-color:var(--g)}.opt.bad{background:var(--bad);border-color:var(--r)}
.fb{padding:10px 14px;border-radius:12px;margin-top:10px;background:var(--ok)}.fb.bad{background:var(--bad)}
.vis{font-size:1.8rem;line-height:1.5;word-break:break-all}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.num{min-width:56px;height:56px;border-radius:14px;border:2px solid var(--g);background:var(--card);color:var(--tx);font-size:1.5rem;font-weight:800;cursor:pointer}
.num.done{background:var(--g);color:#fff}
.big{font-size:2.4rem;font-weight:800;text-align:center;color:var(--g)}
input[type=range]{width:100%;accent-color:var(--g)}
.vid{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.sim{background:var(--bg);border:2px dashed var(--g);border-radius:14px;padding:12px}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}

header{flex-wrap:wrap}.card{border-radius:26px;box-shadow:0 4px 0 var(--ln)}
.btn{min-height:50px;font-size:1.1rem;border-radius:28px;box-shadow:0 4px 0 rgba(0,0,0,.2)}.btn:active{transform:translateY(3px);box-shadow:none}.btn:disabled{opacity:.5}
.big2{font-size:1.3rem;padding:14px 28px}.hero{text-align:center}.logo{width:120px;height:120px;border-radius:50%;background:#fff}
.kids{font-size:3rem}.kids span{display:inline-block;animation:bn 1.6s ease-in-out infinite}.kids span:nth-child(2){animation-delay:.2s}.kids span:nth-child(3){animation-delay:.4s}.kids span:nth-child(4){animation-delay:.6s}
@keyframes bn{50%{transform:translateY(-10px)}}
#app>*{animation:fi .35s both}@keyframes fi{from{opacity:0;transform:translateY(10px)}}
.num{transition:transform .15s}.num:active{transform:scale(1.25)}
.cf{position:fixed;top:-30px;font-size:1.8rem;animation:fall 2s linear forwards;pointer-events:none;z-index:9}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.vgrid{display:grid;grid-template-columns:1fr;gap:14px}
.kids svg{height:105px;width:auto}#kf{display:flex;justify-content:space-around;padding:0 8px;overflow:hidden}#kf svg{height:90px}
.hero{background:linear-gradient(#bfeff2,#e6fafb 60%);color:#1d2b22;padding-bottom:0;overflow:hidden}.hero h2{color:#1f6b3a}
.hero .scene{display:block;width:calc(100% + 32px);max-width:none;height:auto;margin:6px -16px 0}
.yard{background:#b5cf2a;margin:-3px -16px 0;padding:0 16px 18px}.yard .kids{display:flex;justify-content:center;gap:6px;margin-top:-100px;position:relative}.yard .btn{margin-top:6px}
@media(max-width:700px){.yard .kids{margin-top:4px}.yard .kids svg{height:84px}}
.sec{position:relative;overflow:hidden;border-radius:26px;padding:16px 18px 20px;margin:0 0 18px;color:#1d2b22;--card:#fff;--tx:#1d2b22;--ln:#e6dcc0;box-shadow:0 6px 0 rgba(0,0,0,.1),0 10px 24px rgba(0,0,0,.08);transition:transform .25s;animation:fi .45s both;animation-delay:calc(var(--i)*.08s)}.sec:hover{transform:translateY(-3px)}
.s1{background:var(--s1)}.s2{background:var(--s2)}.s3{background:var(--s3)}.s4{background:var(--s4)}.s5{background:var(--s5)}
.deco{position:absolute;right:14px;top:8px;font-size:2rem;opacity:.5}
.sh{display:flex;gap:12px;align-items:center;margin-bottom:8px;padding-right:44px}.sic{width:52px;height:52px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:1.9rem;box-shadow:0 3px 0 rgba(0,0,0,.12);flex:none}.sh h3{margin:0;font-size:1.4rem;color:var(--a,#1f6b3a)}.sh small{color:#4b5b50}
.sec p{max-width:62ch;font-size:1.15rem}.sec .sim{background:#fff}
.ng{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.nc{background:var(--c);border:3px solid #fff;border-radius:20px;padding:8px 6px;cursor:pointer;color:#1d2b22;font:inherit;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.12);transition:transform .2s}.nc:hover{transform:translateY(-4px) rotate(-1.5deg)}
.nc b{display:block;font-size:2.2rem;line-height:1.1;color:#1f6b3a}.nc .nm{display:block;font-weight:700;font-size:.95rem}
.nc .dt{display:grid;grid-template-columns:repeat(5,1fr);margin-top:4px;font-size:.8rem;line-height:1.15}.nc i{font-style:normal}
.pop{animation:pp .45s}@keyframes pp{40%{transform:scale(1.2) rotate(-4deg)}}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}.chip{background:#fff;border-radius:18px;padding:8px 14px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 3px 0 rgba(0,0,0,.1)}.chip span{font-size:1.8rem}
.thead{text-align:center}.thead h2{color:var(--g)}
.pick{background:rgba(255,255,255,.9);border:3px solid #fff;border-radius:26px;padding:14px 16px 16px;margin:14px 0;box-shadow:0 6px 0 rgba(31,107,58,.25);color:#1d2b22}.pick h3{color:#1f6b3a;font-size:1.4rem;margin-top:0}
.tp{background:var(--c,#fff);color:#1d2b22;border:3px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.12);transition:transform .2s}.tp:hover{transform:translateY(-3px) rotate(-.5deg);border-color:#fff}.tp b{font-size:1.1rem}
.pill{display:inline-block;background:#fff;color:#1f6b3a;padding:4px 16px;border-radius:20px;margin-top:16px}
.sec .vis{word-break:normal;overflow-wrap:break-word;font-size:1.3rem}
.bn{border-radius:26px;padding:16px;text-align:center;color:#fff;margin:0 0 16px;box-shadow:0 6px 0 rgba(0,0,0,.15)}.bn h2{color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.35);margin:4px 0}.bn p{margin:0;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.bem{font-size:2.2rem;display:flex;justify-content:center;gap:14px}.bem span{animation:bn 1.8s ease-in-out infinite}.bem span:nth-child(2){animation-delay:.3s}.bem span:nth-child(3){animation-delay:.6s}.bem span:nth-child(4){animation-delay:.9s}
.zr{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.zc{background:#fff;border-radius:18px;padding:8px;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.1)}.zc b{display:block;font-size:2.2rem;color:var(--a)}.zc span{font-size:1.3rem}
.cn{background:#fff;border-radius:18px;padding:10px 12px;margin:0 0 10px;box-shadow:0 3px 0 rgba(0,0,0,.1)}.cn b{color:var(--a)}.cn div{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.ob{text-align:center}.ob i{font-style:normal;font-size:1.8rem;display:block}.ob u{text-decoration:none;font-weight:800;color:var(--a)}
.cmps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.cp{background:#fff;border-radius:18px;padding:10px;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.1);font-size:1.1rem}.cp .sy{font-size:2.4rem;font-weight:800;color:var(--a);line-height:1.2}.cp p{margin:4px 0 0;font-weight:800}
.bars{display:flex;align-items:flex-end;gap:10px;background:#fff;border-radius:18px;padding:10px 12px 0;margin-bottom:10px}.br{flex:1;max-width:80px;border-radius:12px 12px 0 0;background:linear-gradient(var(--a),#c4b5fd);color:#fff;text-align:center;font-size:1.4rem;padding-top:4px}
.tri{display:grid;gap:8px;margin-bottom:6px}.tr{background:#fff;border-radius:18px;padding:8px;display:flex;justify-content:center;align-items:center;gap:10px;font-size:1.6rem;font-weight:800}.tr span{min-width:56px;text-align:center;border-radius:14px;padding:4px}.b1{background:#cfe8ff}.b2{background:#ffd23f}.b3{background:#cdf0d6}
.nl{display:flex;flex-wrap:wrap;gap:6px}.nb{min-width:44px;height:44px;border-radius:12px;border:2px solid var(--a);background:#fff;color:#1d2b22;font-size:1.15rem;font-weight:800;cursor:pointer;transition:transform .15s}.nb:hover{transform:scale(1.15);background:#ffd23f}
.bn{padding:22px 16px}.bn h2{font-size:clamp(1.6rem,5.5vw,2.3rem);font-weight:800;margin:0 0 4px;line-height:1.2}.bn p{font-size:1.1rem;font-weight:600}.bem{display:none}
.zc{min-width:0}.zd{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;overflow:hidden}.zd i{font-style:normal}.cp>div{word-break:break-all;overflow-wrap:anywhere}
.btn.hm{background:#fff;color:#1f6b3a;border:3px solid #1f6b3a;box-shadow:0 4px 0 rgba(31,107,58,.35)}

  b.querySelector("#rs").onclick=draw;draw()},
 // Papan angka 1–20: ketuk untuk melihat dan mendengar nama bilangan
